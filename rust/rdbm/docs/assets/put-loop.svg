<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 852 244" width="852" height="244" role="img" aria-label="put loop: load_chain, then if the records fit in one page, store_chain and commit. Otherwise, if the bucket can split, split it and retry the lookup; if it cannot split because it is at max depth or every record has the same hash, add an overflow page and store the chain.">
  <title>put loop: load_chain, then if the records fit in one page, store_chain and commit. Otherwise, if the bucket can split, split it and retry the lookup; if it cannot split because it is at max depth or every record has the same hash, add an overflow page and store the chain.</title>
  <style>
  text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
  .title { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
  .small { font-size: 11px; }
  .lbl { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .box, .bucket { stroke-width: 1.3; }
  .meta { stroke-width: 1.2; }
  .free { fill: none; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .io, .ioedge { stroke-width: 1.4; }
  .hotbox, .hot { stroke-width: 2; }
  .edge, .thin, .hot, .ioedge, .zoom { fill: none; }
  .edge { stroke-width: 1.3; }
  .thin, .zoom { stroke-width: 1; }
  .dash { stroke-dasharray: 5 4; }
  .zoom { stroke-dasharray: 3 3; }
  .acc { font-weight: 600; }
  svg { color: #1b2320; }
  .bg { fill: #f5f6f3; }
  text { fill: #1b2320; }
  .small, .lbl, .mut-t { fill: #5c6862; }
  .box { fill: #ffffff; stroke: #1b2320; }
  .meta { fill: #e9ece6; stroke: #1b2320; }
  .bucket, .hotbox { fill: #dcefeb; stroke: #0e6f68; }
  .free { stroke: #5c6862; }
  .io { fill: #f6ead8; stroke: #a8671a; }
  .edge { stroke: #1b2320; }
  .thin { stroke: #5c6862; }
  .hot { stroke: #0e6f68; }
  .ioedge { stroke: #a8671a; }
  .zoom { stroke: #cfd5ce; }
  text.acc, tspan.acc, text.acc-t { fill: #0e6f68; }
  text.iot { fill: #a8671a; }
  .mk { fill: #1b2320; }
  .mk-hot { fill: #0e6f68; }
  .mk-io { fill: #a8671a; }
  .mk-muted { fill: #5c6862; }
  @media (prefers-color-scheme: dark) {
  svg { color: #e1e7e3; }
  .bg { fill: #111614; }
  text { fill: #e1e7e3; }
  .small, .lbl, .mut-t { fill: #97a39d; }
  .box { fill: #182019; stroke: #e1e7e3; }
  .meta { fill: #212a25; stroke: #e1e7e3; }
  .bucket, .hotbox { fill: #173532; stroke: #5cc4b6; }
  .free { stroke: #97a39d; }
  .io { fill: #33271a; stroke: #e3a650; }
  .edge { stroke: #e1e7e3; }
  .thin { stroke: #97a39d; }
  .hot { stroke: #5cc4b6; }
  .ioedge { stroke: #e3a650; }
  .zoom { stroke: #34403a; }
  text.acc, tspan.acc, text.acc-t { fill: #5cc4b6; }
  text.iot { fill: #e3a650; }
  .mk { fill: #e1e7e3; }
  .mk-hot { fill: #5cc4b6; }
  .mk-io { fill: #e3a650; }
  .mk-muted { fill: #97a39d; }
  }
</style>
  <rect class="bg" x="-16" y="-16" width="852" height="244" rx="8"/>
          <defs>
            <marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="m4hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk-hot" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>

          <rect class="box" x="20" y="90" width="150" height="50" rx="4"/>
          <text class="title" x="95" y="112" text-anchor="middle">load_chain</text>
          <text class="small" x="95" y="129" text-anchor="middle">bucket + overflow pages</text>
          <line class="edge" x1="170" y1="115" x2="203" y2="115" marker-end="url(#m4)"/>

          <polygon class="box" points="205,115 260,81 315,115 260,149"/>
          <text x="260" y="112" text-anchor="middle">fits in</text>
          <text x="260" y="126" text-anchor="middle">one page?</text>

          <line class="edge" x1="315" y1="115" x2="363" y2="115" marker-end="url(#m4)"/>
          <text class="lbl" x="339" y="108" text-anchor="middle">no</text>

          <polygon class="box" points="365,115 420,81 475,115 420,149"/>
          <text x="420" y="119" text-anchor="middle">can split?</text>

          <line class="hot" x1="475" y1="115" x2="538" y2="115" marker-end="url(#m4hot)"/>
          <text class="lbl acc-t" x="506" y="108" text-anchor="middle">yes</text>

          <rect class="hotbox" x="540" y="90" width="200" height="50" rx="4"/>
          <text class="title" x="640" y="110" text-anchor="middle">split()</text>
          <text class="small" x="640" y="128" text-anchor="middle">move keys whose hash bit d is 1</text>

          <path class="hot" d="M640,140 V186 H95 V142" marker-end="url(#m4hot)"/>
          <text class="lbl acc-t" x="368" y="180" text-anchor="middle">retry against the new directory</text>

          <rect class="box" x="600" y="10" width="200" height="54" rx="4"/>
          <text class="title" x="700" y="32" text-anchor="middle">store_chain → commit</text>
          <text class="small" x="700" y="50" text-anchor="middle">write header · fsync if sync on</text>

          <path class="edge" d="M260,81 V26 H598" marker-end="url(#m4)"/>
          <text class="lbl" x="268" y="52">yes</text>

          <path class="edge" d="M420,81 V52 H598" marker-end="url(#m4)"/>
          <text class="lbl" x="430" y="46">no → overflow page</text>
        </svg>
